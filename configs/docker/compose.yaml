name: ubique-prod-local

networks:
  ubique-prod-local:
    driver: bridge

services:
  web:
    container_name: ubique-web-app-prod-local
    # pull_policy: "always"
    image: "nirvikpurkait/ubique/web-app"
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
      args:
        VITE_STORAGE_APP_HOST: ${VITE_STORAGE_APP_HOST}
        VITE_WEB_APP_HOST: ${VITE_WEB_APP_HOST}
        DATABASE_URL: ${DATABASE_URL}
        STORAGE_APP_HOST: ${STORAGE_APP_HOST}
        WEB_APP_HOST: ${WEB_APP_HOST}
        TOKEN_SECRET: ${TOKEN_SECRET}
        SALT_ROUND: ${SALT_ROUND}
    env_file:
      - ../../.env.production
    ports:
      - 12773:3000
    networks:
      - ubique-prod-local
  storage:
    container_name: ubique-storage-app
    # pull_policy: "always"
    image: "nirvikpurkait/ubique/storage-app"
    build:
      context: ../../
      dockerfile: apps/storage/Dockerfile
      args:
        VITE_STORAGE_APP_HOST: ${VITE_STORAGE_APP_HOST}
        VITE_WEB_APP_HOST: ${VITE_WEB_APP_HOST}
        DATABASE_URL: ${DATABASE_URL}
        STORAGE_APP_HOST: ${STORAGE_APP_HOST}
        WEB_APP_HOST: ${WEB_APP_HOST}
        TOKEN_SECRET: ${TOKEN_SECRET}
        SALT_ROUND: ${SALT_ROUND}
    env_file:
      - ../../.env.production
    ports:
      - 12039:3000
    networks:
      - ubique-prod-local
